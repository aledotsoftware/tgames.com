services:
  nuxt-app:
    build: .
    container_name: nuxt_dev
    ports:
      - "3006:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      - redis
      - mongodb
    networks:
      - dokploy-network
      - app-tier

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - app-tier

  mongodb:
    image: mongo:7
    container_name: mongo_db
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: tudexgames
    volumes:
      - mongo_data:/data/db
    networks:
      - app-tier

networks:
  dokploy-network:
    external: true
  app-tier:
    driver: bridge

volumes:
  redis_data:
  mongo_data:
